<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Геометрический тренажёр</title>
  <meta name="description" content="Интерактивный тренажёр: найдите площадь треугольника по сторонам ортоцентрического треугольника несколькими способами. Подсказки и счётчик ошибок.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">

  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="glow"></div><div class="grid"></div></div>

  <header class="topbar">
    <a href="#" class="brand" title="К способам решения">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 4L29 27H3z"/><path d="M16 4v23M3 27l19.5-11.5M29 27L9.5 15.5" class="bm-alt"/></svg>
      </span>
      <span class="brand-name">Геометрический<br>тренажёр</span>
    </a>

    <div class="counters" aria-label="Счётчики">
      <div class="counter counter-wrong" title="Неверных ответов">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="counter-num" id="cnt-wrong">0</span>
        <span class="counter-lbl">ошибок</span>
      </div>
      <div class="counter counter-hint" title="Использовано подсказок">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
        <span class="counter-num" id="cnt-hints">0</span>
        <span class="counter-lbl">подсказок</span>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="btn-figure" hidden title="Показать чертёж">
        <svg viewBox="0 0 24 24"><path d="M12 3L22 20H2z"/><path d="M12 3v17"/></svg>
        <span>Чертёж</span>
      </button>
      <button class="icon-btn" id="btn-restart" hidden title="Начать заново">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <div class="drawer" id="figure-drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-label="Чертёж к задаче">
      <div class="drawer-head">
        <b>Чертёж к задаче</b>
        <button class="icon-btn" data-close title="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="drawer-figure figure"></div>
      <p class="drawer-note">$B_1C_1 = 5$, $A_1C_1 = 12$, $A_1B_1 = 13$. Высоты $AA_1$, $BB_1$, $CC_1$ пересекаются в точке $H$ и являются биссектрисами углов треугольника $A_1B_1C_1$; $A_1A_2$, $B_1B_2$, $C_1C_2$ — эти биссектрисы.</p>
    </div>
  </div>

  <noscript><p class="container">Для работы тренажёра включите JavaScript.</p></noscript>

  <!-- defer: скрипты выполняются по порядку, KaTeX готов до первого рендера -->
  <script defer src="js/data.js"></script>
  <script defer src="js/figure.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
